services:
  claude-plan-provisioning:
    build:
      context: ./claude-plan-provisioning
      dockerfile: Dockerfile
    container_name: claude-plan-provisioning
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=claude-plan-provisioning-prod-secret-change-in-env
      - ADMIN_PASSWORD=supersecureadminpass123
    restart: unless-stopped

  google-workspace-iam:
    build:
      context: ./google-workspace-iam
      dockerfile: Dockerfile
    container_name: google-workspace-iam
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - API_KEY=gws-secure-production-api-key-2026
      - JWT_SECRET=gws-secure-jwt-secret-2026-production
    restart: unless-stopped

  gcp-iam:
    build:
      context: ./gcp-iam
      dockerfile: Dockerfile
    container_name: gcp-iam
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - JWT_SECRET=gcp-iam-production-secret-key-2026-change-in-env
    restart: unless-stopped

  jira-access:
    build:
      context: ./jira-access
      dockerfile: Dockerfile
    container_name: jira-access
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - ADMIN_PASSWORD=jiraprodmasterpassword123
      - JWT_SECRET=jira-access-production-jwt-secret-2026
    restart: unless-stopped
