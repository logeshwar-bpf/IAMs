services:
  claude-plan-provisioning:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-plan-provisioning
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=claude-plan-provisioning-prod-secret-change-in-env
      - ADMIN_PASSWORD=supersecureadminpass123
    restart: unless-stopped